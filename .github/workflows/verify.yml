name: Verify site
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build && npm test
      - run: npm run build && npm test
        env:
          VITE_SITE_URL: https://casinoproscons.com
          VITE_SITE_INDEXABLE: 'true'
